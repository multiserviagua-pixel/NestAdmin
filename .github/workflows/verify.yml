name: Verify harness and specifications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check specifications
        run: python scripts/check.py
      - name: Test specification checker
        run: python -m unittest discover -s scripts/tests -v
      # Usa cargo metadata; rustup instala la versión de rust-toolchain.toml.
      - name: Third-party notices up to date
        run: python scripts/third_party.py --check
      - name: Test evaluation harness
        run: python -m unittest discover -s evaluation/tests -v

  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # La aplicación de escritorio incrusta ui/dist al compilar.
      - name: Build interface
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      # rustup instala la versión de rust-toolchain.toml al primer uso.
      - name: Check formatting
        run: cargo fmt --all --check
      # La ventana Tauri es solo para Windows (D19): en Linux se excluye.
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked ${{ runner.os == 'Linux' && '--exclude nestadmin-desktop' || '' }} -- -D warnings
      - name: Test
        run: cargo test --workspace --locked ${{ runner.os == 'Linux' && '--exclude nestadmin-desktop' || '' }}

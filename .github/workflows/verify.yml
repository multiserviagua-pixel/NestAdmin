name: Verify harness and specifications

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check specifications
        run: python scripts/check.py
      - name: Test specification checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Test evaluation harness
        run: python -m unittest discover -s evaluation/tests -v

  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup instala la versión de rust-toolchain.toml al primer uso.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test core
        run: cargo test --locked

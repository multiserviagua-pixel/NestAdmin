[package]
name = "nestadmin-certs"
version = "0.1.0"
description = "Análisis y validación de certificados X.509 de remisión (T18b, D278): huella, tipo, NIF, vigencia, clientAuth y clave. Parte pura y multiplataforma; sin CNG, PFX, DPAPI ni red."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reutiliza la validación de NIF, NIE y CIF del núcleo de venta (D80) en vez de duplicarla.
nestadmin-sales = { path = "../sales" }
sha2 = "0.10"
thiserror = "2"
x509-parser = "=0.18.1"

[dev-dependencies]
# Solo con el backend `ring`: nada de `aws-lc-rs` (D279). Certificados sintéticos en tiempo de ejecución.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

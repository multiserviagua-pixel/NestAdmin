[package]
name = "nestadmin-app"
version = "0.1.0"
description = "Capa de aplicación de NestAdmin: flujo de documentos y correo, revisión, reglas e historial."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-ai = { path = "../ai" }
nestadmin-core = { path = "../core" }
nestadmin-documents = { path = "../documents" }
nestadmin-extract = { path = "../extract" }
nestadmin-mail = { path = "../mail" }
nestadmin-simulators = { path = "../simulators" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
base64 = "0.23"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
tempfile = "3"
url = "2"

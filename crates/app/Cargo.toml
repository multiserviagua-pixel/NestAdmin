[package]
name = "nestadmin-app"
version = "0.1.0"
description = "Capa de aplicación de NestAdmin: flujo de documentos y correo, revisión, reglas e historial."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-ai = { path = "../ai" }
nestadmin-core = { path = "../core" }
nestadmin-documents = { path = "../documents" }
nestadmin-simulators = { path = "../simulators" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

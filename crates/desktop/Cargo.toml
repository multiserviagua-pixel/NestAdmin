[package]
name = "nestadmin-desktop"
version = "0.1.0"
description = "Ventana Tauri de NestAdmin: área de notificación, instancia única y comandos de la capa de aplicación."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nestadmin"
path = "src/main.rs"

[features]
# Versiones de prueba: la IA solo trabaja bajo demanda en lo opcional (D133, D134).
lectura-bajo-demanda = ["nestadmin-app/lectura-bajo-demanda"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
nestadmin-ai = { path = "../ai" }
nestadmin-app = { path = "../app" }
nestadmin-core = { path = "../core" }
nestadmin-documents = { path = "../documents" }
nestadmin-extract = { path = "../extract" }
nestadmin-mail = { path = "../mail" }
nestadmin-sales = { path = "../sales" }
nestadmin-setup = { path = "../setup" }
# Mismos importes decimales que la venta (como cadenas en la ventana); ya estaba en Cargo.lock.
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
# Modo de fallo de los simuladores en los recorridos (D53).
nestadmin-simulators = { path = "../simulators" }
# Runtime simulado de Tauri para los recorridos desde la ventana (D53); no añade paquetes.
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }
tempfile = "3"
# Reloj fijo de la prueba de venta (D197); ya enlazado por nestadmin-app.
nestadmin-verifactu = { path = "../verifactu" }

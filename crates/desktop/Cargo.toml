[package]
name = "nestadmin-desktop"
version = "0.1.0"
description = "Ventana Tauri de NestAdmin: área de notificación, instancia única y comandos de la capa de aplicación."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nestadmin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
nestadmin-ai = { path = "../ai" }
nestadmin-app = { path = "../app" }
nestadmin-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"

[package]
name = "nestadmin-setup"
version = "0.1.0"
description = "Preparación de NestAdmin en el primer arranque: detecta, descarga e instala Ollama, el modelo y Tesseract, y verifica la IA local."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Mismo cliente que la IA: sin proxy implícito (D12).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"

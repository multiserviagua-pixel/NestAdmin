[package]
name = "nestadmin-setup"
version = "0.1.0"
description = "Preparación de componentes locales: OCR del paquete, Ollama, servicio, modelo y verificación real de la IA local (R08, D36–D40)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-ai = { path = "../ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Mismo cliente que la IA: sin proxy implícito (D12).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"

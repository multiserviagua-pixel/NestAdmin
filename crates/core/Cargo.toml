[package]
name = "nestadmin-core"
version = "0.1.0"
description = "Núcleo local de NestAdmin: almacenamiento, cola durable y acciones idempotentes."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-documents = { path = "../documents" }
nestadmin-sales = { path = "../sales" }
# Misma configuración que nestadmin-sales y nestadmin-documents (D04, D75).
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

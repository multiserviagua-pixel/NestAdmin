[package]
name = "nestadmin-core"
version = "0.1.0"
description = "Núcleo local de NestAdmin: almacenamiento, cola durable y acciones idempotentes."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-documents = { path = "../documents" }
nestadmin-sales = { path = "../sales" }
nestadmin-verifactu = { path = "../verifactu" }
# Misma configuración que nestadmin-sales y nestadmin-documents (D04, D75).
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# Bytes aleatorios del sistema para el número de instalación (D291); ya está en el árbol (`mail`).
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[features]
# Ganchos de corte del traslado (profiles::migrate), solo para las pruebas de recuperación; la
# activan las dev-dependencies de este mismo crate, como `test-support` en `certs`.
test-hooks = []

[dev-dependencies]
tempfile = "3"
# Autorreferencia: las pruebas activan `test-hooks` sin que lo vea ninguna otra compilación.
nestadmin-core = { path = ".", features = ["test-hooks"] }

[package]
name = "nestadmin-core"
version = "0.1.0"
description = "Núcleo local de NestAdmin: almacenamiento, cola durable y acciones idempotentes."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

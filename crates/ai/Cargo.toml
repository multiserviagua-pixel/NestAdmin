[package]
name = "nestadmin-ai"
version = "0.1.0"
description = "Proveedores de IA de NestAdmin: Ollama local por defecto y Groq solo por selección explícita."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nestadmin-predict"
path = "src/bin/predict.rs"

[dependencies]
nestadmin-documents = { path = "../documents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Cliente HTTP síncrono sin proxy implícito (D12).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

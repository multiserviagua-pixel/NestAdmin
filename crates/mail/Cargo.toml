[package]
name = "nestadmin-mail"
version = "0.1.0"
description = "Conectores de correo reales de NestAdmin: Microsoft Graph y Gmail API con OAuth de escritorio."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-ai = { path = "../ai" }
nestadmin-core = { path = "../core" }
nestadmin-simulators = { path = "../simulators" }
base64 = "0.23"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Cliente HTTP síncrono sin proxy implícito (D12, D32).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
url = "2"

[dev-dependencies]
tempfile = "3"

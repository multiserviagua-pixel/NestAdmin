[package]
name = "nestadmin-sales"
version = "0.1.0"
description = "Lógica pura de la facturación de venta de NestAdmin: cálculo decimal, numeración, estados, contenido de la factura y NIF."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-documents = { path = "../documents" }
# Misma configuración que nestadmin-documents (D04, D75): sin opciones por defecto.
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

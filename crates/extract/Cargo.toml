[package]
name = "nestadmin-extract"
version = "0.1.0"
description = "Extracción local de texto de NestAdmin: texto plano, PDF con PDFium y OCR con Tesseract."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

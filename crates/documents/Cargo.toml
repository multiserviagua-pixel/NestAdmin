[package]
name = "nestadmin-documents"
version = "0.1.0"
description = "Documentos de NestAdmin: entrada de texto, modelo de factura, validación decimal y posibles duplicados."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[package]
name = "nestadmin-simulators"
version = "0.1.0"
description = "Simuladores locales de correo y administración de NestAdmin, sin red ni cuentas reales."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nestadmin-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
